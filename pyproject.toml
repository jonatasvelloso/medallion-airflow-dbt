[project]
name = "medallion-airflow-dbt"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["medallion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
